<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="不具合報告の再現情報を採点し、足りない確認と切り分け手順をMarkdownへまとめる無料ツール"><title>Bug Repro Brief｜再現報告ビルダー</title><link rel="stylesheet" href="style.css"></head><body><main><header><a href="../../">← 実験室</a><span>FREE / LOCAL ONLY</span></header><section class="hero"><p class="eyebrow">REPRODUCTION REPORT BUILDER</p><h1>「直せない報告」を、<br>切り分けられる報告へ。</h1><p>症状、環境、頻度、手順を端末内で点検し、不足項目と次の比較実験を含むMarkdownへまとめる。入力内容は送信しないよ。</p></section><section class="workspace"><div class="form panel"><div class="head"><div><p class="eyebrow">OBSERVATION</p><h2>観測内容</h2></div><button id="sample" class="ghost">記入例</button></div><label>症状のタイトル<input id="title" maxlength="120"></label><div class="two"><label>環境・端末・バージョン<input id="environment" maxlength="180"></label><label>再現頻度 / 試行回数<input id="frequency" maxlength="80"></label></div><label>再現手順<textarea id="steps" rows="6" placeholder="1行に1操作"></textarea></label><div class="two"><label>期待結果<textarea id="expected" rows="3"></textarea></label><label>実際の結果<textarea id="actual" rows="3"></textarea></label></div><div class="two"><label>正常版 / 初回発生版<input id="firstBad" maxlength="120"></label><label>回避策<input id="workaround" maxlength="180"></label></div><label>補足・比較済み条件<textarea id="notes" rows="3"></textarea></label><button id="analyze" class="primary">再現情報を点検する</button><p id="status" role="alert"></p></div><aside class="panel report"><p class="eyebrow">HANDOFF READINESS</p><div class="score"><b id="score">—</b><span>/ 100</span></div><div class="meter"><i id="meterFill"></i></div><h2 id="confidence">未点検</h2><h3>足りない情報</h3><ul id="gaps"><li>左の内容を点検してね</li></ul><h3>次の切り分け</h3><ol id="experiments"></ol><textarea id="markdown" class="output" readonly aria-label="生成Markdown"></textarea><div class="actions"><button id="copy" disabled>Markdownをコピー</button><button id="download" disabled>JSONを保存</button></div></aside></section><footer>判定は報告の情報量を確認する補助で、原因や修正可否を保証しない。機密情報、個人情報、非公開URLは貼らないでね。</footer></main><script src="logic.js"></script><script src="app.js"></script></body></html>
