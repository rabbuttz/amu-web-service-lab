<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="制作依頼の納品物・修正回数・利用範囲を1分で整理する無料ツール"><title>Scope Canvas｜制作依頼の範囲整理</title><link rel="stylesheet" href="style.css"></head>
<body><main><header><a href="../../">← 実験室</a><span>入力は端末内だけで処理</span></header><section class="hero"><p class="eyebrow">CREATOR BRIEF TOOL</p><h1>依頼の「どこまで」を<br>1枚にする。</h1><p>制作物の種類と条件を選ぶと、納品物・修正回数・見落としやすい合意事項を整理した依頼範囲メモを作るよ。</p></section>
<section class="workspace"><form id="builder" class="panel"><fieldset><legend>1. 制作物</legend><div class="type-grid" id="types"><label><input type="radio" name="type" value="illustration" checked><span>一枚絵<small>イラスト・キービジュアル</small></span></label><label><input type="radio" name="type" value="model3d"><span>3Dモデル<small>モデル・アバター・小物</small></span></label><label><input type="radio" name="type" value="web"><span>Webページ<small>LP・告知・ポートフォリオ</small></span></label><label><input type="radio" name="type" value="video"><span>短尺動画<small>PV・告知クリップ</small></span></label></div></fieldset>
<fieldset><legend>2. 追加する範囲</legend><div class="checks"><label><input type="checkbox" name="option" value="source"><span>編集可能な元データ</span></label><label><input type="checkbox" name="option" value="commercial"><span>商用利用</span></label><label><input type="checkbox" name="option" value="variants"><span>差分3点</span></label><label><input type="checkbox" name="option" value="handoff"><span>導入・引き継ぎ</span></label></div></fieldset>
<div class="row"><label>修正回数<select id="revisions"><option value="1">1回</option><option value="2">2回</option><option value="3">3回</option><option value="4">4回</option></select></label><label class="urgent"><input type="checkbox" id="urgent">通常より短い納期</label></div><button class="primary" type="submit">依頼範囲メモを作る</button><p class="fine">範囲ポイントは価格の見積もりではなく、条件を比較する補助指標だよ。</p></form>
<section class="panel result" id="result" aria-live="polite"><div class="empty"><div class="sheet-icon">▤</div><h2>条件を選んでメモを作成</h2><p>依頼者と制作者の認識合わせに、そのままコピーして使える。</p></div></section></section>
<footer>無料・ログイン不要・入力送信なし</footer></main><script src="logic.js?v=1"></script><script src="app.js?v=1"></script></body></html>
