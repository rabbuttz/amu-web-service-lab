<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="JSONセーブの容量内訳と保存枠・履歴込みの上限到達を端末内で監査"><title>Save Weight Radar｜セーブ容量監査</title><link rel="stylesheet" href="style.css"></head><body><main><header><a href="../../">← 実験室</a><span>FREE / LOCAL ONLY</span></header><section class="hero"><p class="eyebrow">SAVE DATA SIZE AUDITOR</p><h1>セーブの重さを、<br>パス単位で見つける。</h1><p>JSONセーブ例から大きいデータ枝を抽出し、保存枠・履歴世代・容量上限を含めた総使用量と増加余力を計算する。入力JSONは端末外へ送信しないよ。</p></section><section class="workspace"><div class="panel form"><div class="head"><div><p class="eyebrow">INPUT</p><h2>セーブ条件</h2></div><button id="sample" class="ghost">記入例</button></div><label>JSONセーブ例<textarea id="json" rows="15" spellcheck="false"></textarea></label><div class="grid"><label>保存枠数<input id="slots" type="number" min="1" max="100"></label><label>履歴世代数<input id="history" type="number" min="0" max="100"></label><label>容量上限（KiB）<input id="quotaKiB" type="number" min="1"></label><label>1セーブの日次増加（byte）<input id="growthBytes" type="number" min="0"></label></div><button id="analyze" class="primary">容量を監査する</button><p id="status" role="alert"></p></div><aside class="panel result"><p class="eyebrow">SIZE MAP</p><div class="gauge"><div id="gaugeFill"></div></div><div class="metrics"><div><b id="single">—</b><span>1セーブ</span></div><div><b id="stored">—</b><span>枠・履歴込み</span></div><div><b id="ratio">—</b><span>上限使用率</span></div></div><h2>大きいパス</h2><ol id="paths"></ol><h2>確認事項</h2><ul id="findings"></ul><textarea id="report" readonly aria-label="監査レポート"></textarea><div class="actions"><button id="copy" disabled>レポートをコピー</button><button id="download" disabled>JSONを保存</button></div></aside></section><footer>仮説: 実セーブの容量内訳と保存枠・履歴込みの総量を実装途中で確認できれば、クラウド保存上限や肥大化をリリース前に発見できる。主要指標は complete / start。</footer></main><script src="logic.js"></script><script src="app.js"></script></body></html>
