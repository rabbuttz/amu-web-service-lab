<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="ドロップ率と天井から、入手確率・平均・90%到達回数を可視化する無料ゲームバランスツール"><title>Pity Curve｜ドロップ率・天井シミュレーター</title><link rel="stylesheet" href="style.css"></head><body><main><header><a href="../../">← 実験室</a><span>FREE / NO LOGIN</span></header><section class="hero"><p class="eyebrow">DROP RATE REALITY CHECK</p><h1>「1%」の体験を、<br>人数で見る。</h1><p>基本ドロップ率、確率上昇、天井を設定し、プレイヤーが何回で入手できるかを確率分布で確認するゲーム制作者向けツール。</p></section><section class="workspace"><aside class="controls"><label>基本ドロップ率 <span><input id="rate" type="number" value="1" min="0.001" max="100" step="0.1">%</span></label><div class="pair"><label>確率上昇の開始 <span><input id="soft" type="number" value="50" min="0" max="10000">回</span></label><label>1回ごとの上昇 <span><input id="increase" type="number" value="2" min="0" max="100" step="0.1">pt</span></label></div><label>確定天井 <span><input id="hard" type="number" value="80" min="0" max="10000">回</span><small>0なら天井なし</small></label><label>確認したい回数 <span><input id="checkpoint" type="number" value="60" min="1" max="10000">回</span></label><div class="buttons"><button id="preset" class="ghost">例に戻す</button><button id="calculate">分布を計算</button></div></aside><section id="result" class="result" aria-live="polite"></section></section><section class="note"><b>数字の読み方</b><p>各試行は入手まで独立して抽選し、確率上昇は指定回から加算、天井では100%になるモデルだよ。複数個獲得、10連保証、抽選テーブル共有は含まない。</p></section></main><script src="logic.js"></script><script src="app.js"></script></body></html>
