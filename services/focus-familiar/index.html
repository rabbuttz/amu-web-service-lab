<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Focus Familiar Expedition</title><link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <header><div><p class="eyebrow">FOCUS EXPEDITION / FREE WEB SERVICE</p><h1>Focus Familiar</h1></div><div class="save-pill"><span class="dot"></span>端末内に自動保存</div></header>
  <section class="layout">
    <div class="scene card">
      <div class="sky"><span>机上世界・微光の書庫</span><span id="phaseBadge">準備中</span></div>
      <div class="avatar-wrap" id="avatarWrap" aria-label="権利上安全なプレースホルダーアバター">
        <svg viewBox="0 0 320 360" role="img" aria-label="プレースホルダーの小さな探索者">
          <defs><linearGradient id="coat" x1="0" y1="0" x2="1" y2="1"><stop id="coatA" stop-color="#8d7dff"/><stop id="coatB" offset="1" stop-color="#4ad5c1"/></linearGradient></defs>
          <ellipse cx="160" cy="328" rx="92" ry="17" fill="#0b1125" opacity=".45"/>
          <path class="tail" d="M224 247 Q296 220 278 156 Q264 118 250 156" fill="none" stroke="url(#coat)" stroke-width="18" stroke-linecap="round"/>
          <path d="M106 96 L91 30 L143 70 M214 96 L229 30 L177 70" fill="url(#coat)" stroke="#17203a" stroke-width="7"/>
          <circle cx="160" cy="125" r="72" fill="#f2cfb7" stroke="#17203a" stroke-width="7"/>
          <path d="M91 125 Q93 48 160 50 Q228 48 229 126 Q201 100 160 92 Q122 109 91 125" fill="url(#coat)"/>
          <g class="face curious"><circle cx="133" cy="128" r="8" fill="#182039"/><circle cx="188" cy="128" r="8" fill="#182039"/><path d="M148 151 Q160 163 174 151" fill="none" stroke="#9b5264" stroke-width="5" stroke-linecap="round"/></g>
          <g class="face calm"><path d="M123 130 Q133 120 143 130 M178 130 Q188 120 198 130" fill="none" stroke="#182039" stroke-width="6" stroke-linecap="round"/><path d="M150 154 Q160 160 170 154" fill="none" stroke="#9b5264" stroke-width="4"/></g>
          <g class="face bold"><path d="M123 119 L143 126 M198 119 L178 126" stroke="#182039" stroke-width="5"/><circle cx="133" cy="132" r="7"/><circle cx="188" cy="132" r="7"/><path d="M149 153 Q161 166 174 152" fill="none" stroke="#9b5264" stroke-width="5"/></g>
          <path d="M100 310 Q95 190 160 184 Q226 190 220 310 Z" fill="url(#coat)" stroke="#17203a" stroke-width="7"/>
          <path d="M122 212 Q160 236 198 212" fill="none" stroke="#fff" opacity=".6" stroke-width="8"/>
          <path class="arm arm-l" d="M112 215 Q65 239 80 285" fill="none" stroke="#f2cfb7" stroke-width="22" stroke-linecap="round"/>
          <path class="arm arm-r" d="M208 215 Q252 238 243 283" fill="none" stroke="#f2cfb7" stroke-width="22" stroke-linecap="round"/>
          <circle cx="79" cy="286" r="13" fill="#f2cfb7"/><circle cx="244" cy="284" r="13" fill="#f2cfb7"/>
          <path d="M130 309 L122 337 M190 309 L199 337" stroke="#17203a" stroke-width="23" stroke-linecap="round"/>
        </svg>
        <div class="float-note" id="floatNote">あなたの作業を見守っています</div>
      </div>
      <div class="progress-track"><div id="progressBar"></div></div>
      <div class="timer-row"><strong id="timer">00:20</strong><span id="statusText">探索方針を決めてください</span></div>
    </div>

    <aside class="controls card">
      <div id="setupPanel">
        <p class="step">1 / 見た目が旅の記録を変える</p>
        <label>表情</label><div class="seg" id="moodBtns"><button data-value="curious" class="active">好奇心</button><button data-value="calm">慎重</button><button data-value="bold">意気揚々</button></div>
        <label>衣装色</label><div class="swatches" id="colorBtns"><button data-value="violet" class="violet active" aria-label="すみれ"></button><button data-value="mint" class="mint" aria-label="薄荷"></button><button data-value="sunset" class="sunset" aria-label="夕焼け"></button></div>
        <label class="switch"><input id="tailToggle" type="checkbox" checked><span>揺れ物あり：足跡に「風紋」を残す</span></label>
        <p class="step top">2 / 探索方針</p>
        <div class="routes" id="routeBtns">
          <button data-value="archive" class="active"><b>古い書架</b><span>標本多め・静かな旅</span></button>
          <button data-value="garden"><b>窓辺の庭</b><span>色彩多め・偶然の旅</span></button>
          <button data-value="attic"><b>時計塔の屋根裏</b><span>希少品狙い・空振りも</span></button>
        </div>
        <button class="primary" id="startBtn">20秒の集中探索を始める</button>
        <button class="ghost" id="offlineBtn">「2時間ぶり」を試す</button>
      </div>
      <div id="rewardPanel" hidden>
        <p class="step">帰還報告 / 30秒の選択</p><h2>どちらを標本棚へ？</h2><div id="rewardChoices" class="rewards"></div>
        <p class="hint">採用しなかった品は旅日誌に記録されます。</p>
      </div>
    </aside>
  </section>

  <section class="bottom-grid">
    <div class="card shelf"><div class="section-title"><h2>標本棚</h2><span id="shelfCount">0 / 12</span></div><div id="shelf"></div></div>
    <div class="card journal"><div class="section-title"><h2>旅行日誌</h2><button id="resetBtn" class="text-btn">記録をリセット</button></div><div id="journal"><p class="empty">まだ旅の記録はありません。</p></div></div>
  </section>
</main>
<script src="game.js?v=3"></script><script src="app.js?v=3"></script>
</body></html>
