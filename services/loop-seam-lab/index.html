<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="音声ループの継ぎ目を解析し、クリックノイズの少ない境界候補とクロスフェード済みWAVを作る無料ツール"><title>Loop Seam Lab｜音声ループ継ぎ目チェッカー</title><link rel="stylesheet" href="style.css"></head><body><main><header><a href="../../">← 実験室</a><span>FREE / LOCAL ONLY</span></header><section class="hero"><p class="eyebrow">AUDIO LOOP AUDIT</p><h1>ループの継ぎ目を、<br>耳と数値で整える。</h1><p>音声の開始・終了点にある振幅と傾きの差を測り、近傍からクリックの少ない境界を探す。音声はブラウザ内だけで処理されるよ。</p></section><section class="panel"><div class="panel-head"><div><p class="eyebrow">SOURCE</p><h2>音声を選ぶ</h2></div><button id="sample" class="ghost">生成サンプルを使う</button></div><label class="file"><input id="file" type="file" accept="audio/*"><strong id="fileName">WAV / MP3 / OGGを選択</strong><span>外部送信なし</span></label><canvas id="wave" width="1000" height="270"></canvas><div class="times"><label>開始 <input id="start" type="range" min="0" max="10000" value="1200"><b id="startTime">—</b></label><label>終了 <input id="end" type="range" min="0" max="10000" value="8800"><b id="endTime">—</b></label></div><button id="analyze" class="primary">継ぎ目を解析する</button><p id="error" role="alert"></p></section><section class="result"><div class="result-head"><div><p class="eyebrow">SEAM SCORE</p><h2 id="summary">解析待ち</h2></div><strong id="score">—</strong></div><div class="stats"><article><small>振幅差</small><b id="jump">—</b></article><article><small>傾き差</small><b id="slope">—</b></article><article><small>ループ長</small><b id="duration">—</b></article></div><div id="suggestion" class="suggestion">生成サンプルで機能をすぐ確認できるよ。</div><div class="actions"><button id="apply" class="ghost" disabled>候補を適用</button><button id="play" class="ghost" disabled>ループ試聴</button><button id="export" class="primary" disabled>クロスフェードWAVを保存</button></div><p id="status"></p></section><section class="notes"><h2>判定について</h2><p>境界前後の振幅差と波形の傾き差を合成した相対スコア。素材の音色や残響でも聞こえ方は変わるため、候補適用後に必ず試聴してね。書き出し時は末尾10msを先頭へクロスフェードする。</p></section></main><script src="logic.js"></script><script src="app.js"></script></body></html>
