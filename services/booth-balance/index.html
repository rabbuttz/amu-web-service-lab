<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="同人イベント・展示即売会の損益分岐を3分で比較する無料シミュレーター"><title>Booth Balance｜イベント販売の損益分岐</title><link rel="stylesheet" href="style.css"></head><body><main><header><a href="../../">← 実験室</a><span>計算は端末内だけ</span></header><section class="hero"><p class="eyebrow">EVENT SALES SIMULATOR</p><h1>何個売れたら、<br>赤字を抜ける？</h1><p>即売会やポップアップ出店の固定費、単価、在庫、来場見込みから、損益分岐と低調・想定・好調の3ケースを比較するよ。</p></section><section class="layout"><form id="calculator" class="panel"><h2>前提を入力</h2><fieldset><legend>固定費</legend><label>出展料<input name="booth" type="number" min="0" value="5000"><i>円</i></label><label>交通・搬入<input name="travel" type="number" min="0" value="3000"><i>円</i></label><label>その他<input name="other" type="number" min="0" value="0"><i>円</i></label></fieldset><fieldset><legend>商品と見込み</legend><label>販売価格<input name="price" type="number" min="0" value="1500"><i>円/個</i></label><label>製造原価<input name="unitCost" type="number" min="0" value="400"><i>円/個</i></label><label>持込在庫<input name="stock" type="number" min="0" value="20"><i>個</i></label><label>見込み客数<input name="visitors" type="number" min="0" value="100"><i>人</i></label><label>購入率<input name="conversion" type="number" min="0" max="100" step="0.1" value="12"><i>%</i></label></fieldset><button type="submit">3ケースを再計算</button></form><section class="results"><div class="summary panel"><div><span>1個あたり粗利</span><strong id="margin">—</strong></div><div><span>事前に必要な現金</span><strong id="upfront">—</strong></div><div class="break"><span>損益分岐</span><strong id="breakEven">—</strong><small id="feasibility"></small></div></div><div id="scenarios" class="scenarios"></div><p id="note" class="note"></p><aside><b>この計算に含むもの</b><p>出店者側の簡易P&amp;L。売れた分の原価だけを費用化し、売れ残りは在庫として扱うよ。主催者側の採算、税金、人件費、廃棄損は含まない。</p></aside></section></section><footer>無料・ログイン不要・入力送信なし</footer></main><script src="logic.js?v=1"></script><script src="app.js?v=1"></script></body></html>
