<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="スプライトアニメのFPSを並べて比較し、タイミング設定を保存できる無料ツール"><title>Sprite Tempo｜スプライトFPS比較</title><link rel="stylesheet" href="style.css"></head><body><main><header><a href="../../">← 実験室</a><span>画像は端末内だけで処理</span></header><section class="hero"><p class="eyebrow">SPRITE ANIMATION TIMING LAB</p><h1>動きの速さを、<br>並べて決める。</h1><p>スプライトシートを読み込み、2つのFPSを同時再生して比較。採用したタイミングをJSONで保存できるよ。</p></section><section class="workspace"><aside class="panel controls"><label class="file">画像を選ぶ<input id="file" type="file" accept="image/png,image/jpeg,image/webp"><small>未選択時は6コマのデモを使用</small></label><div class="grid2"><label>列数<input id="columns" type="number" min="1" max="32" value="6"></label><label>行数<input id="rows" type="number" min="1" max="32" value="1"></label><label>開始コマ<input id="from" type="number" min="1" value="1"></label><label>終了コマ<input id="to" type="number" min="1" value="6"></label></div><div class="speed"><label>A <b id="aVal">8 FPS</b><input id="fpsA" type="range" min="1" max="30" value="8"></label><label>B <b id="bVal">12 FPS</b><input id="fpsB" type="range" min="1" max="30" value="12"></label></div><button id="toggle">一時停止</button><p id="status">6コマをループ再生中</p></aside><section class="stage"><div class="players"><article><div class="tag">A <span id="aTag">8 FPS</span></div><canvas id="canvasA" width="420" height="320"></canvas><button class="choose" data-choice="A">Aを採用</button></article><article><div class="tag">B <span id="bTag">12 FPS</span></div><canvas id="canvasB" width="420" height="320"></canvas><button class="choose" data-choice="B">Bを採用</button></article></div><section id="result" class="result" hidden><span>採用設定</span><strong id="chosen">—</strong><p id="detail"></p><button id="download">タイミングJSONを保存</button></section></section></section><footer>無料・ログイン不要・画像送信なし</footer></main><script src="logic.js?v=1"></script><script src="app.js?v=1"></script></body></html>
