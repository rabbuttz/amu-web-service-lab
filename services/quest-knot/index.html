<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="クエスト依存関係の循環・参照漏れ・進行段階をブラウザ内で検査する無料ツール"><title>Quest Knot｜クエスト依存チェック</title><link rel="stylesheet" href="style.css"></head><body><main><header><a href="../../">← 実験室</a><span>NO LOGIN / LOCAL ONLY</span></header><section class="hero"><p class="eyebrow">QUEST DEPENDENCY CHECKER</p><h1>進行不能を、実装前にほどく。</h1><p>1行に「クエストID: 前提ID」を書くと、循環参照・存在しない前提・進行段階を検査する。入力は端末内だけで処理するよ。</p></section><section class="workspace"><section class="editor"><label for="source">クエスト定義</label><textarea id="source" spellcheck="false">wake:
forest:wake
forge:wake
bridge:forest,forge
boss:bridge</textarea><div class="actions"><button id="analyze">依存関係を検査</button><button id="export" class="secondary">結果JSONをコピー</button></div><p class="hint">形式: <code>ID: 前提ID, 前提ID</code>　前提なしはコロンの右を空欄にする。</p><p id="copyStatus" role="status"></p></section><section class="results"><div class="summary"><div><small>クエスト</small><strong id="nodeCount">0</strong></div><div><small>依存</small><strong id="edgeCount">0</strong></div><div><small>進行段階</small><strong id="stageCount">0</strong></div></div><canvas id="graph" width="760" height="390" aria-label="クエスト依存グラフ"></canvas><section id="report" class="report" aria-live="polite"></section></section></section><section class="privacy"><strong>計測について</strong><p>訪問・表示・検査開始・JSON出力完了の回数だけを匿名カウンターへ送る。クエスト定義や識別情報は送信しない。カウンター障害時も検査機能は動作する。</p></section></main><script src="logic.js"></script><script src="app.js"></script></body></html>
