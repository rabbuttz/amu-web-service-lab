<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="コミットログや変更メモを、公開用パッチノートへ端末内で整形する無料ツール"><title>Patch Note Forge｜変更ログ整形</title><link rel="stylesheet" href="style.css"></head><body><main><header><a href="../../">← 実験室</a><span>入力は端末外へ送信しない</span></header><section class="hero"><p class="eyebrow">RELEASE NOTE WORKBENCH</p><h1>作った変更を、<br>伝わる更新情報へ。</h1><p>コミットログや箇条書きを貼ると、追加・修正・変更に分類し、重複や内部作業を除いたMarkdownへ整えるよ。</p></section><section class="workbench"><section class="input panel"><div class="meta"><label>タイトル<input id="title" value="アップデート"></label><label>バージョン<input id="version" placeholder="v1.2.0"></label><label>公開日<input id="date" type="date"></label></div><label>変更ログ<textarea id="source" rows="13" spellcheck="false" placeholder="feat(ui): add photo mode&#10;fix: resolve save crash #42&#10;chore: update dependencies"></textarea></label><div class="row"><label class="check"><input id="internal" type="checkbox"> 内部更新も含める</label><button id="sample" class="sub">例を入れる</button></div><button id="generate">パッチノートを生成</button></section><section class="output panel"><div class="output-head"><div><span>整形結果</span><strong id="summary">変更ログを入力してね</strong></div><button id="copy" class="sub" disabled>コピー</button></div><pre id="preview"># アップデート
