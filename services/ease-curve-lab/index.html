<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="イージング曲線を動きで比較し、CSS cubic-bezierとUnity向けサンプルを持ち帰れる無料ツール"><title>Ease Curve Lab｜動きの緩急設計</title><link rel="stylesheet" href="style.css"></head>
<body><main><header><a href="../../">← 実験室</a><span>NO LOGIN / LOCAL ONLY</span></header>
<section class="hero"><p class="eyebrow">MOTION CURVE WORKBENCH</p><h1>曲線を、動きとして確かめる。</h1><p>4つの制御点からイージングを作り、等速移動と並べて体感する。CSSとUnity向けサンプルは端末内だけで生成するよ。</p></section>
<section class="lab"><section class="stage"><canvas id="curve" width="720" height="440" aria-label="イージング曲線"></canvas><div class="motion"><div class="lane"><span>CURVE</span><i id="curveDot"></i></div><div class="lane muted"><span>LINEAR</span><i id="linearDot"></i></div></div><div class="readout"><div><small>50%時点の進行</small><strong id="midValue">50%</strong></div><div><small>最大速度比</small><strong id="speedValue">1.00×</strong></div><div><small>性格</small><strong id="character">等速</strong></div></div><button id="play">動きを再生</button></section>
<section class="controls"><label>プリセット<select id="preset"><option value="ease">Ease</option><option value="easeInOut">Ease In Out</option><option value="snappy">Snappy</option><option value="overshoot">Overshoot</option><option value="custom">Custom</option></select></label><div class="pair"><label>X1 <output id="x1Out"></output><input id="x1" type="range" min="0" max="1" step="0.01"></label><label>Y1 <output id="y1Out"></output><input id="y1" type="range" min="-1" max="2" step="0.01"></label><label>X2 <output id="x2Out"></output><input id="x2" type="range" min="0" max="1" step="0.01"></label><label>Y2 <output id="y2Out"></output><input id="y2" type="range" min="-1" max="2" step="0.01"></label></div><label>再生時間 <output id="durationOut"></output><input id="duration" type="range" min="200" max="2000" step="50" value="800"></label><button id="export">実装コードを表示・コピー</button><p id="status" role="status"></p><pre id="code" hidden></pre></section></section>
<section class="note"><h2>読み方</h2><p>横軸が時間、縦軸が進行量。白い点は選択した曲線、灰色の点は等速だよ。Y値を0〜1の外に出すと行き過ぎや戻りを作れる。Unity向け出力は9点の近似サンプルなので、最終調整はAnimationCurve上で行ってね。</p></section></main><script src="logic.js"></script><script src="app.js"></script></body></html>
