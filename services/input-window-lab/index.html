<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="ジャンプのコヨーテタイムと先行入力を実際に試し、ゲーム向け設定を作る無料ツール"><title>Input Window Lab｜ジャンプ入力猶予の調整</title><link rel="stylesheet" href="style.css"></head><body><main><header><a href="../../">← 実験室</a><span>NO LOGIN / LOCAL ONLY</span></header><section class="hero"><p class="eyebrow">PLATFORMER INPUT TUNER</p><h1>入力猶予を、実際に押して決める。</h1><p>足場を離れた直後のコヨーテタイムと、着地直前の先行入力を同じコースで試せる。採用値はJSONで持ち帰れるよ。</p></section><section class="lab"><section class="play"><div class="status"><span id="phaseLabel">助走中</span><span>試行 <b id="tries">0</b></span></div><canvas id="game" width="760" height="360" aria-label="入力猶予を試すループコース"></canvas><button id="jump">JUMP <small>Space / Tap</small></button><p id="result" aria-live="polite">足場の端を過ぎた直後か、着地の直前に押してみてね。</p></section><section class="controls"><div class="score"><div><small>成功した特殊入力</small><strong><b id="specials">0</b> / 2</strong></div><span id="badge">未検証</span></div><label>コヨーテタイム <output id="coyoteOut">120 ms</output><input id="coyote" type="range" min="0" max="250" step="10" value="120"></label><label>先行入力 <output id="bufferOut">140 ms</output><input id="buffer" type="range" min="0" max="250" step="10" value="140"></label><div class="legend"><span><i class="normal"></i>接地</span><span><i class="coyote"></i>コヨーテ</span><span><i class="buffer"></i>先行入力</span></div><button id="copy" class="secondary">設定JSONをコピー</button><pre id="preset"></pre><p class="privacy">設定値や操作内容は送信しない。利用回数だけ匿名カウンターへ送る。</p></section></section><section class="note"><b>実装の目安</b><p>接地を失った時刻とジャンプ押下時刻を別々に保存し、物理更新で両方の猶予を判定する構成を想定している。出力値はエンジン非依存だよ。</p></section></main><script src="logic.js"></script><script src="app.js"></script></body></html>
