<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="ゲーム内通貨の流入と流出をセッション単位で試算し、枯渇・蓄積を検査する無料ツール"><title>Economy Tide｜ゲーム内通貨バランス試算</title><link rel="stylesheet" href="style.css"></head><body><main><header><a href="../../">← 実験室</a><span>NO LOGIN / LOCAL ONLY</span></header><section class="hero"><p class="eyebrow">GAME ECONOMY SANDBOX</p><h1>通貨の満ち引きを、実装前に見る。</h1><p>報酬と消費先をセッション単位で重ね、残高推移・枯渇地点・流出率を試算する。入力は端末内だけで処理するよ。</p></section><section class="setup"><div><label for="initial">初期残高</label><input id="initial" type="number" min="0" value="500"></div><div><label for="sessions">試算セッション数</label><input id="sessions" type="number" min="1" max="365" value="30"></div><button id="run">設計を診断</button></section><section class="workspace"><section class="events"><div class="section-head"><div><p class="eyebrow">SOURCES & SINKS</p><h2>流入・流出項目</h2></div><button id="add" class="secondary">＋ 項目</button></div><div class="table-wrap"><table><thead><tr><th>項目</th><th>種類</th><th>量</th><th>開始</th><th>終了</th><th>間隔</th><th></th></tr></thead><tbody id="rows"></tbody></table></div></section><section class="results"><div class="summary"><div><small>最終残高</small><strong id="final">—</strong></div><div><small>流出 / 流入</small><strong id="coverage">—</strong></div><div><small>最低残高</small><strong id="minimum">—</strong></div></div><canvas id="chart" width="900" height="360" aria-label="セッションごとの通貨残高推移"></canvas><section id="diagnosis" class="diagnosis" aria-live="polite"></section><div class="actions"><button id="copy">試算JSONをコピー</button><span id="copyStatus" role="status"></span></div></section></section><section class="privacy"><strong>計測について</strong><p>訪問・表示・診断開始・JSON出力完了の回数だけを匿名カウンターへ送る。入力した数値や項目名、個人識別情報は送信しない。カウンター障害時も試算機能は動作する。</p></section></main><template id="rowTemplate"><tr><td><input data-key="label" aria-label="項目名"></td><td><select data-key="type" aria-label="種類"><option value="source">流入</option><option value="sink">流出</option></select></td><td><input data-key="amount" type="number" min="0" aria-label="量"></td><td><input data-key="from" type="number" min="1" aria-label="開始"></td><td><input data-key="to" type="number" min="1" aria-label="終了"></td><td><input data-key="every" type="number" min="1" aria-label="間隔"></td><td><button class="remove" aria-label="項目を削除">×</button></td></tr></template><script src="logic.js"></script><script src="app.js"></script></body></html>
