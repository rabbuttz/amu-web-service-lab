<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="ヒットストップ、画面揺れ、フラッシュ、拡縮を触って比較し、ゲームの打撃感プリセットを作る無料ツール"><title>Hit Feel Lab｜打撃感の調整ツール</title><link rel="stylesheet" href="style.css"></head><body><main><header><a href="../../">← 実験室</a><span>NO LOGIN / LOCAL ONLY</span></header><section class="hero"><p class="eyebrow">GAME FEEDBACK TUNER</p><h1>打撃感を、数値と手触りで決める。</h1><p>ヒットストップ・揺れ・フラッシュ・拡縮を調整して、同じ標的を何度でも叩ける。決めた設定はJSONで持ち帰れるよ。</p></section><section class="lab"><div class="stage" id="stage"><div class="hud"><span>HP <b id="hp">5</b>/5</span><span>撃破 <b id="kills">0</b></span></div><div class="target-wrap"><div class="target" id="target"><span class="face">●</span><i></i></div><div id="damage" class="damage">1</div></div><button id="strike">HIT <small>Space</small></button><p>ボタンまたはSpaceで試打</p></div><section class="controls"><div class="meter"><div><small>IMPACT</small><strong id="impact">—</strong></div><span id="impactLabel">—</span><i><b id="impactBar"></b></i></div><label>ヒットストップ <output id="stopOut">55 ms</output><input id="stop" type="range" min="0" max="120" value="55"></label><label>画面揺れ <output id="shakeOut">8 px</output><input id="shake" type="range" min="0" max="20" value="8"></label><label>白フラッシュ <output id="flashOut">90 ms</output><input id="flash" type="range" min="0" max="180" value="90"></label><label>パンチ拡縮 <output id="scaleOut">15 %</output><input id="scale" type="range" min="0" max="30" value="15"></label><button id="copy" class="secondary">プリセットJSONをコピー</button><pre id="preset"></pre><p class="privacy">設定値や操作内容は送信しない。利用回数だけ匿名カウンターへ送る。</p></section></section><section class="note"><b>実装への移し方</b><p>出力値はエンジン非依存の目安。ヒットストップ中も入力受付やUI更新まで停止させないよう、ゲーム本体の時間倍率とは処理を分けるのが安全だよ。</p></section></main><script src="logic.js"></script><script src="app.js"></script></body></html>
