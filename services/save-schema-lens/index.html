<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="旧版と新版のJSONセーブデータを端末内で比較し、移行リスクとチェックリストを作る無料ツール"><title>Save Schema Lens｜JSONセーブ移行チェック</title><link rel="stylesheet" href="style.css"></head><body><main><header><a href="../../">← 実験室</a><span>JSONは端末外へ送信しない</span></header><section class="hero"><p class="eyebrow">SAVE DATA COMPATIBILITY CHECK</p><h1>更新前に、壊れる<br>セーブを見つける。</h1><p>旧版と新版のJSON例を比較して、フィールド削除・型変更・配列構造の差を抽出し、移行チェックリストを作るよ。</p></section><section class="editor"><article class="panel"><label><span>旧バージョン</span><small>現在配布中のセーブ例</small><textarea id="old" spellcheck="false" rows="14" placeholder='{"player":{"level":10}}'></textarea></label></article><div class="arrow">→</div><article class="panel"><label><span>新バージョン</span><small>更新後のセーブ例</small><textarea id="next" spellcheck="false" rows="14" placeholder='{"player":{"level":"10"}}'></textarea></label></article></section><div class="actions"><button id="sample" class="ghost">例を入れる</button><button id="analyze">互換性を確認</button></div><section id="result" class="result panel" aria-live="polite"><div class="empty">2つのJSONを入力すると、ここに移行リスクが表示されるよ。</div></section><section class="privacy"><b>無料・ログイン不要</b><span>JSONの内容はブラウザ内だけで処理し、アクセス解析には操作回数だけを送るよ。実データではなく匿名化した代表例の利用を推奨するよ。</span></section></main><script src="logic.js"></script><script src="app.js"></script></body></html>
