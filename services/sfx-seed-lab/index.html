<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="ゲーム用の短い効果音をブラウザ内で合成し、WAVで保存できる無料ツール"><title>SFX Seed Lab｜ゲーム効果音ジェネレーター</title><link rel="stylesheet" href="style.css"></head><body><main><header><a href="../../">← 実験室</a><span>NO LOGIN / LOCAL SYNTH</span></header><section class="hero"><p class="eyebrow">PROCEDURAL GAME AUDIO</p><h1>効果音の種を、数値から鳴らす。</h1><p>コイン、ヒット、ジャンプ、決定音のプリセットを調整し、その場で試聴してWAVに保存できる。音声データはブラウザ内だけで生成するよ。</p></section><section class="workbench"><section class="preview"><div class="preview-head"><span id="presetName">COIN</span><span id="durationLabel">260 ms</span></div><canvas id="scope" width="760" height="280" aria-label="生成した効果音の波形"></canvas><button id="play" class="play">▶ 音を試す</button><p id="status" aria-live="polite">プリセットを選ぶか、パラメーターを調整してね。</p></section><section class="panel"><div class="presets" role="group" aria-label="効果音プリセット"><button data-preset="coin" class="active">Coin</button><button data-preset="hit">Hit</button><button data-preset="jump">Jump</button><button data-preset="confirm">Confirm</button></div><label>開始周波数 <output id="startHzOut"></output><input id="startHz" type="range" min="80" max="1800" step="10"></label><label>終了周波数 <output id="endHzOut"></output><input id="endHz" type="range" min="40" max="1800" step="10"></label><label>長さ <output id="durationOut"></output><input id="duration" type="range" min="60" max="800" step="10"></label><label>ノイズ <output id="noiseOut"></output><input id="noise" type="range" min="0" max="100" step="1"></label><label>波形 <select id="wave"><option value="sine">Sine</option><option value="square">Square</option><option value="triangle">Triangle</option></select></label><div class="actions"><button id="randomize">少し変える</button><button id="download">WAVを保存</button></div><pre id="recipe"></pre><p class="privacy">設定値や生成音は送信しない。利用回数だけ匿名カウンターへ送る。</p></section></section><section class="note"><b>使い方</b><p>プリセットを起点に「少し変える」で候補を増やし、ゲーム内で使う音はWAVとして保存する。44.1 kHz / mono / 16-bit PCMで出力するよ。</p></section></main><script src="logic.js"></script><script src="app.js"></script></body></html>
