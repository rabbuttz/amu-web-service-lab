<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="複数アクションのクールダウンと効果時間を並べ、空白時間を確認できる無料ゲーム設計ツール"><title>Cooldown Weave｜クールダウン配置設計</title><link rel="stylesheet" href="style.css"></head><body><main><header><a href="../../">← 実験室</a><span>NO LOGIN / LOCAL ONLY</span></header><section class="hero"><p class="eyebrow">ABILITY ROTATION PLANNER</p><h1>クールダウンを、空白なく編む。</h1><p>複数アクションの再使用時間・効果時間・初回発動を同じ時間軸に並べ、ローテーションの穴を見つける。設定値は端末内だけで処理するよ。</p></section><section class="lab"><section class="stage"><div class="summary"><div><small>効果カバー率</small><strong id="coverage">0%</strong></div><div><small>最長の空白</small><strong id="gap">0秒</strong></div><div><small>発動回数</small><strong id="uses">0</strong></div></div><div class="axis"><span>0s</span><span id="axisMid">15s</span><span id="axisEnd">30s</span></div><div id="timeline" class="timeline"></div><p id="verdict" class="verdict" aria-live="polite"></p></section><section class="controls"><label class="horizon">観測時間 <output id="horizonOut">30秒</output><input id="horizon" type="range" min="10" max="60" step="5" value="30"></label><div id="abilityControls"></div><button id="copy">設計JSONを表示・コピー</button><p id="copyStatus" role="status"></p><pre id="jsonOutput" hidden></pre></section></section><section class="note"><h2>読み方</h2><p>各行の色が効果中の時間。灰色の「全体カバー」行に切れ目があれば、どのアクションも効果中でない時間だよ。発動は「初回 + クールダウン × n」の単純モデルで、実際の入力遅延やチャージ制は含まない。</p></section></main><script src="logic.js"></script><script src="app.js"></script></body></html>
