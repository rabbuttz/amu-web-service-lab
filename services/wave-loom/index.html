<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="敵ウェーブの密度・休憩・脅威曲線を可視化し、ゲーム向け設計JSONを作る無料ツール"><title>Wave Loom｜敵ウェーブ設計</title><link rel="stylesheet" href="style.css"></head><body><main><header><a href="../../">← 実験室</a><span>NO LOGIN / LOCAL ONLY</span></header><section class="hero"><p class="eyebrow">ENCOUNTER PACING PLANNER</p><h1>敵ウェーブの呼吸を、先に見る。</h1><p>戦闘時間・ウェーブ数・休憩・敵構成から、出現タイムラインと脅威曲線を生成する。設定値は端末内だけで処理するよ。</p></section><section class="lab"><section class="stage"><div class="summary"><div><small>総出現数</small><strong id="total">0</strong></div><div><small>ピーク脅威</small><strong id="peak">0</strong></div><div><small>休憩比率</small><strong id="restRatio">0%</strong></div></div><canvas id="chart" width="760" height="300" aria-label="脅威曲線"></canvas><div class="legend"><span><i class="grunt"></i>Grunt</span><span><i class="ranger"></i>Ranger</span><span><i class="brute"></i>Brute</span></div><div id="timeline" class="timeline"></div><p id="verdict" class="verdict" aria-live="polite"></p></section><section class="controls"><label>戦闘時間 <output id="durationOut">90秒</output><input id="duration" type="range" min="30" max="180" step="10" value="90"></label><label>ウェーブ数 <output id="wavesOut">5</output><input id="waves" type="range" min="2" max="10" value="5"></label><label>ウェーブ間の休憩 <output id="restOut">5秒</output><input id="rest" type="range" min="0" max="15" value="5"></label><label>終盤の強度 <output id="rampOut">180%</output><input id="ramp" type="range" min="80" max="260" step="10" value="180"></label><fieldset><legend>敵構成</legend><label>Grunt 比率 <input id="grunt" type="range" min="0" max="10" value="6"></label><label>Ranger 比率 <input id="ranger" type="range" min="0" max="10" value="3"></label><label>Brute 比率 <input id="brute" type="range" min="0" max="10" value="1"></label></fieldset><button id="export">設計JSONを表示・コピー</button><p id="copyStatus" role="status"></p><pre id="jsonOutput" hidden></pre></section></section><section class="note"><h2>モデルの前提</h2><p>各ウェーブ内で敵を均等に出現させ、脅威値を Grunt=1、Ranger=1.6、Brute=3 として集計する簡易モデルだよ。敵の生存時間、同時出現上限、プレイヤー火力は含まないため、初期のテンポ比較に使う想定。</p></section></main><script src="logic.js"></script><script src="app.js"></script></body></html>
