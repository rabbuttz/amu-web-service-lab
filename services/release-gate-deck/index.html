<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="変更領域、対象環境、テスト時間から優先回帰テストを組む無料ツール"><title>Release Gate Deck｜回帰テスト計画</title><link rel="stylesheet" href="style.css"></head><body><main><header><a href="../../">← 実験室</a><span>FREE / LOCAL ONLY</span></header><section class="hero"><p class="eyebrow">RELEASE TEST PLANNER</p><h1>限られた時間を、<br>壊れやすい組み合わせへ。</h1><p>変更領域のリスクと対象環境の重要度・関連タグから、時間内に実行するスモークテストと回帰確認を優先順に組む。入力内容は送信しないよ。</p></section><section class="workspace"><div class="panel form"><div class="head"><div><p class="eyebrow">INPUT</p><h2>リリース条件</h2></div><button id="sample" class="ghost">記入例</button></div><div class="two"><label>リリース名<input id="name"></label><label>テスト予算（分）<input id="budget" type="number" min="15" max="1440"></label></div><label>変更領域 <small>名前 | リスク1〜5 | 関連タグ | 確認内容</small><textarea id="changes" rows="7"></textarea></label><label>対象環境 <small>環境名 | 重要度1〜3 | 特徴タグ</small><textarea id="targets" rows="6"></textarea></label><button id="build" class="primary">テスト計画を組む</button><p id="status" role="alert"></p></div><aside class="panel result"><p class="eyebrow">PRIORITY PLAN</p><div class="time"><b id="used">—</b><span>/ <i id="budgetOut">—</i>分</span></div><h2 id="coverage">未計算</h2><p id="warning"></p><ol id="plan"></ol><p id="deferred"></p><textarea id="markdown" readonly aria-label="生成Markdown"></textarea><div class="actions"><button id="copy" disabled>Markdownをコピー</button><button id="download" disabled>JSONを保存</button></div></aside></section><footer>仮説: リリース前確認を全組み合わせではなく、変更リスク・対象重要度・関連性で優先付けすると、短い確認時間でも重大な退行を拾いやすくなる。主要指標は complete / start。</footer></main><script src="logic.js"></script><script src="app.js"></script></body></html>
